name: Deploy server
on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/shared/**"
      - "package.json"
      - ".github/workflows/server.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Typecheck client and server
        run: npm run typecheck
      - name: Deploy Cloudflare Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: End the currently active match (one-time owner request)
        run: |
          STATE=$(curl --fail --silent --show-error https://tank-turn-tactics-api.awesome69421.workers.dev/api/game/state)
          echo "$STATE"
          if [[ "$STATE" == *'"phase":"active"'* ]]; then
            curl --fail-with-body --silent --show-error --request POST https://tank-turn-tactics-api.awesome69421.workers.dev/api/game/end-now
          else
            echo "No active shared match to end."
          fi
